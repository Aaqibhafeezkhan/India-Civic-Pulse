name: Validate civic pulse

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile ingestion module
        run: python -m py_compile scripts/ingest.py
      - name: Run ingestion unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: node --check app.js
