name: Refresh civic data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ingest.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: civic-data-refresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ingestion code
        run: python -m unittest discover -s tests -v
      - name: Refresh official source snapshot
        run: python scripts/ingest.py --output data/stories.json
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/stories.json; then
            echo "Source snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories.json
          git commit -m "Refresh official civic source data"
          git push
